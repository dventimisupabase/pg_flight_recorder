name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: PostgreSQL ${{ matrix.pg_version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        pg_version: [15, 16, 17, 18]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run tests on PostgreSQL ${{ matrix.pg_version }}
        run: |
          ./test.sh ${{ matrix.pg_version }}

  bundle-check:
    name: Install Bundle
    runs-on: ubuntu-latest

    # Verifies that scripts/build_install_bundle.sh produces a self-contained
    # single-file install for each extension, that the output contains zero
    # psql metacommands, and that the bundles install cleanly into a running
    # Postgres 17 with pg_cron + pg_stat_statements preloaded -- the
    # Supabase SQL editor's effective target environment.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build bundles
        run: |
          ./scripts/build_install_bundle.sh pgfr_record  dist/pgfr_record-bundle.sql
          ./scripts/build_install_bundle.sh pgfr_analyze dist/pgfr_analyze-bundle.sql

      - name: Verify no psql metacommands remain
        run: |
          if grep -nE '^\\' dist/pgfr_record-bundle.sql dist/pgfr_analyze-bundle.sql; then
            echo "ERROR: bundle still contains psql metacommands"
            exit 1
          fi

      - name: Build Postgres 17 test image
        run: docker compose -f docker-compose.yml -f pgfr_record/docker-compose.yml -f pgfr_analyze/docker-compose.yml --profile pg17 build --progress=plain

      - name: Start Postgres 17 and install bundles
        run: |
          docker run --rm -d --name pgfr_bundle_check \
            -e POSTGRES_PASSWORD=postgres \
            pgfr_record_test:17 \
            -c "shared_preload_libraries=pg_cron,pg_stat_statements" \
            -c "cron.database_name=postgres"

          for i in $(seq 1 60); do
            docker exec pgfr_bundle_check pg_isready -U postgres -q 2>/dev/null && break
            sleep 1
          done

          docker exec pgfr_bundle_check psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION pg_cron; CREATE EXTENSION pg_stat_statements;"

          docker cp dist/pgfr_record-bundle.sql  pgfr_bundle_check:/tmp/
          docker cp dist/pgfr_analyze-bundle.sql pgfr_bundle_check:/tmp/

          docker exec pgfr_bundle_check psql -U postgres -d postgres -v ON_ERROR_STOP=1 -q -f /tmp/pgfr_record-bundle.sql
          docker exec pgfr_bundle_check psql -U postgres -d postgres -v ON_ERROR_STOP=1 -q -f /tmp/pgfr_analyze-bundle.sql

          # Confirm both schemas are present and that the recorder
          # scheduled its cron jobs as expected. Avoids time-sensitive
          # health_check fields like "Sample Collection" which depend on
          # whether a cron firing has happened yet.
          docker exec pgfr_bundle_check psql -U postgres -d postgres -v ON_ERROR_STOP=1 -tA \
            -c "SELECT count(*) FROM pg_namespace WHERE nspname IN ('pgfr_record', 'pgfr_analyze');" \
            | grep -qx 2

          docker exec pgfr_bundle_check psql -U postgres -d postgres -v ON_ERROR_STOP=1 -tA \
            -c "SELECT count(*) FROM cron.job WHERE jobname LIKE 'pgfr_%';" \
            | awk '$1 < 4 { print "expected >=4 pgfr cron jobs, got " $1; exit 1 }'

      - name: Tear down
        if: always()
        run: docker stop pgfr_bundle_check || true

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test, bundle-check]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests failed on one or more PostgreSQL versions"
            exit 1
          fi
          if [ "${{ needs.bundle-check.result }}" != "success" ]; then
            echo "Install bundle check failed"
            exit 1
          fi
          echo "All tests and bundle check passed"
