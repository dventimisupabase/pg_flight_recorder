name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - install.html
      - .github/workflows/pages.yml
  # workflow_run, not `release: published`. GitHub Actions intentionally
  # does not cascade `release` events when the release was created by
  # another workflow using GITHUB_TOKEN -- which is exactly how our
  # Release workflow operates. workflow_run is the documented escape
  # hatch for cross-workflow chaining and is unaffected by that
  # safeguard. The if-guard below skips deploys when Release itself
  # failed so we never publish bundles from a half-finished release.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Skip cascade deploys when the upstream Release workflow failed --
    # we don't want to publish bundles from a release that never reached
    # GitHub Releases. Non-workflow_run triggers (push, dispatch) carry
    # no workflow_run context, so the condition is true for them too.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fetch the latest release's install bundles and rename them to
      # versionless filenames so install.html can fetch them from a stable
      # URL. The install page surfaces the actual version it ships via the
      # tag stamped in below.
      - name: Download latest-release bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          echo "Latest release tag: $TAG"
          gh release download "$TAG" -p '*-bundle.sql' --clobber
          # Strip versioned filenames to stable names install.html expects.
          for f in *-${TAG}-bundle.sql; do
            mv "$f" "${f/-${TAG}/}"
          done
          ls -la *.sql || true
          echo "$TAG" > .release-tag

      # Uninstall scripts are pure-SQL and channel-agnostic, so they live
      # in the source tree (not the release artifacts). Copy them to the
      # site root with the same naming convention install.html expects.
      - name: Copy uninstall scripts to site root
        run: |
          cp pgfr_record/uninstall.sql  pgfr_record-uninstall.sql
          cp pgfr_analyze/uninstall.sql pgfr_analyze-uninstall.sql

      - name: Stamp install page with release version
        run: |
          TAG=$(cat .release-tag)
          sed -i "s|RELEASE_VERSION|${TAG}|g" install.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
